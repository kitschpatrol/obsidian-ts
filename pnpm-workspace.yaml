publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - case-police
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  esbuild: true
  unrs-resolver: true
peerDependencyRules:
  allowedVersions:
    # No ESLint 10 release yet (jsx-eslint/eslint-plugin-jsx-a11y#1075); its rules never run here (no JSX)
    'eslint-plugin-jsx-a11y>eslint': '10'
